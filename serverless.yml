org: noordh94
service: stopover-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  getFlights:
    handler: functions/getFlights/index.handler
    events:
      - httpApi:
          path: /api/flights
          method: GET

  getFlightById:
    handler: functions/getFlightById/index.handler
    events:
      - httpApi:
          path: /api/flights/{id}
          method: GET

  addFlight:
    handler: functions/addFlight/index.handler
    events:
      - httpApi:
          path: /api/flights
          method: POST